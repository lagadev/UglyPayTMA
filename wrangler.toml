name = "paylink"
main = "src/index.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# wrangler d1 create paylink-db   ->  paste the returned id below
[[d1_databases]]
binding = "DB"
database_name = "paylink-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Public, non-secret settings. BOT_TOKEN is a SECRET — never put it here:
#   wrangler secret put BOT_TOKEN
[vars]
SITE_NAME = "PayLink"
INVOICE_TTL_MINUTES = "15"
APK_URL = "https://github.com/lagadev/uglypayapk/releases/download/v1.0.0/app-debug.apk"
SUPPORT_TELEGRAM = ""
